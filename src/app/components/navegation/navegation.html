<nav class="relative">
  <button
    type="button"
    class="flex h-11 w-11 items-center justify-center rounded-lg border border-green-800 bg-white text-green-800 shadow-sm transition-colors hover:bg-green-50 md:hidden"
    aria-label="Abrir menú"
    [attr.aria-expanded]="menuOpen()"
    (click)="toggleMenu()"
  >
    <svg
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      class="h-6 w-6"
      aria-hidden="true"
    >
      <path d="M4 7h16M4 12h16M4 17h16" stroke-linecap="round" />
    </svg>
  </button>

  <!-- MENÚ DESKTOP -->
  <ul class="hidden items-center gap-2 md:flex">
    <li>
      <a
        class="border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
        routerLink="/"
      >
        Inicio
      </a>
    </li>

    @if (authService.isAuthenticated()) {
      <li>
        <a
          class="border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          routerLink="/animal/crear"
        >
          + Animal
        </a>
      </li>

      <li>
        <a
          class="border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          routerLink="/category/crear"
        >
          + Categoría
        </a>
      </li>

      <li>
        <button
          type="button"
          class="border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          (click)="logout()"
        >
          Cerrar sesión
        </button>
      </li>
    } @else {
      <li>
        <a
          class="border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          routerLink="/login"
        >
          Iniciar sesión
        </a>
      </li>
    }
  </ul>

  <!-- MENÚ MÓVIL -->
  @if (menuOpen()) {
    <ul
      class="absolute right-0 top-14 z-20 mt-2 w-52 overflow-hidden rounded-xl border border-green-200 bg-white shadow-lg md:hidden"
    >
      <li>
        <a
          class="block border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          routerLink="/"
          (click)="closeMenu()"
        >
          Inicio
        </a>
      </li>

      <li>
        <a
          class="block border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
          routerLink="/user"
          (click)="closeMenu()"
        >
          Usuario
        </a>
      </li>

      @if (authService.isAuthenticated()) {
        <li>
          <a
            class="block border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
            routerLink="/animal/crear"
            (click)="closeMenu()"
          >
            + Animal
          </a>
        </li>

        <li>
          <a
            class="block border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
            routerLink="/category/crear"
            (click)="closeMenu()"
          >
            + Categoría
          </a>
        </li>

        <li>
          <button
            type="button"
            class="block w-full border-b border-gray-100 px-4 py-3 text-left font-semibold text-green-800 transition-colors hover:bg-green-50"
            (click)="logout()"
          >
            Cerrar sesión
          </button>
        </li>
      } @else {
        <li>
          <a
            class="block border-b border-gray-100 px-4 py-3 font-semibold text-green-800 transition-colors hover:bg-green-50"
            routerLink="/login"
            (click)="closeMenu()"
          >
            Iniciar sesión
          </a>
        </li>
      }
    </ul>
  }
</nav>
